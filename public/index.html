  <body>
    <div id="brand-intro" class="brand-intro" aria-hidden="true">
      <svg class="brand-intro__mark" viewBox="0 0 748 790" role="presentation" focusable="false">
        <defs>
          <image id="brand-logo-source" href="/assets/logo-hero.jpeg" x="0" y="0" width="748" height="790" />
          <clipPath id="brand-clip-ring" clipPathUnits="userSpaceOnUse">
            <path clip-rule="evenodd" d="M374 18a356 376 0 1 1 0 752a356 376 0 1 1 0-752Zm0 55a301 320 0 1 0 0 640a301 320 0 1 0 0-640Z" />
          </clipPath>
          <clipPath id="brand-clip-mark" clipPathUnits="userSpaceOnUse"><ellipse cx="374" cy="395" rx="365" ry="385" /></clipPath>
          <clipPath id="brand-clip-hat" clipPathUnits="userSpaceOnUse"><rect x="205" y="0" width="340" height="215" /></clipPath>
          <clipPath id="brand-clip-flame" clipPathUnits="userSpaceOnUse"><rect x="520" y="135" width="185" height="250" /></clipPath>
          <clipPath id="brand-clip-hot-h" clipPathUnits="userSpaceOnUse"><rect x="88" y="170" width="190" height="220" /></clipPath>
          <clipPath id="brand-clip-hot-o" clipPathUnits="userSpaceOnUse"><rect x="250" y="165" width="220" height="220" /></clipPath>
          <clipPath id="brand-clip-hot-t" clipPathUnits="userSpaceOnUse"><rect x="430" y="170" width="160" height="220" /></clipPath>
          <clipPath id="brand-clip-n" clipPathUnits="userSpaceOnUse"><rect x="250" y="300" width="250" height="150" /></clipPath>
          <clipPath id="brand-clip-spizee-s" clipPathUnits="userSpaceOnUse"><rect x="65" y="350" width="225" height="285" /></clipPath>
          <clipPath id="brand-clip-spizee-rest" clipPathUnits="userSpaceOnUse"><rect x="245" y="350" width="455" height="285" /></clipPath>
          <clipPath id="brand-clip-chili" clipPathUnits="userSpaceOnUse"><rect x="210" y="525" width="350" height="165" /></clipPath>
          <clipPath id="brand-clip-restaurant" clipPathUnits="userSpaceOnUse"><rect x="120" y="635" width="510" height="95" /></clipPath>
          <clipPath id="brand-clip-tagline" clipPathUnits="userSpaceOnUse"><rect x="110" y="700" width="530" height="90" /></clipPath>
          <linearGradient id="brand-light-sweep" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".95" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g class="brand-intro__pieces" aria-hidden="true">
          <g class="brand-intro__piece brand-intro__piece--ring" clip-path="url(#brand-clip-ring)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--hat" clip-path="url(#brand-clip-hat)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--flame" clip-path="url(#brand-clip-flame)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--hot-h" clip-path="url(#brand-clip-hot-h)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--hot-o" clip-path="url(#brand-clip-hot-o)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--hot-t" clip-path="url(#brand-clip-hot-t)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--n" clip-path="url(#brand-clip-n)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--spizee-s" clip-path="url(#brand-clip-spizee-s)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--spizee-rest" clip-path="url(#brand-clip-spizee-rest)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--chili" clip-path="url(#brand-clip-chili)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--restaurant" clip-path="url(#brand-clip-restaurant)"><use href="#brand-logo-source" /></g>
          <g class="brand-intro__piece brand-intro__piece--tagline" clip-path="url(#brand-clip-tagline)"><use href="#brand-logo-source" /></g>
        </g>
        <g class="brand-intro__hud" aria-hidden="true">
          <circle class="brand-intro__orbit brand-intro__orbit--outer" cx="374" cy="395" r="374" />
          <circle class="brand-intro__orbit brand-intro__orbit--inner" cx="374" cy="395" r="343" />
          <path class="brand-intro__draw-ring" d="M374 22a356 373 0 1 1 0 746a356 373 0 1 1 0-746Z" />
        </g>
        <g class="brand-intro__embers" aria-hidden="true">
          <g transform="translate(94 650)"><g class="brand-intro__ember brand-intro__ember--one"><circle r="4" fill="#E31C23" /></g></g>
          <g transform="translate(650 675)"><g class="brand-intro__ember brand-intro__ember--two"><circle r="3" fill="#FFC107" /></g></g>
          <g transform="translate(155 525)"><g class="brand-intro__ember brand-intro__ember--three"><circle r="2.5" fill="#FFC107" /></g></g>
          <g transform="translate(600 500)"><g class="brand-intro__ember brand-intro__ember--four"><circle r="3.5" fill="#E31C23" /></g></g>
          <g transform="translate(215 710)"><g class="brand-intro__ember brand-intro__ember--five"><circle r="2" fill="#000000" /></g></g>
          <g transform="translate(545 705)"><g class="brand-intro__ember brand-intro__ember--six"><circle r="2.5" fill="#FFC107" /></g></g>
        </g>
        <g class="brand-intro__exact-mark" aria-hidden="true"><use href="#brand-logo-source" /></g>
        <circle class="brand-intro__lock-pulse" cx="374" cy="395" r="351" aria-hidden="true" />
        <g class="brand-intro__light-sweep" clip-path="url(#brand-clip-mark)" aria-hidden="true">
          <path d="M-110 0h88l470 790h-88Z" fill="url(#brand-light-sweep)" />
        </g>
      </svg>
    </div>
    <a class="skip-link" href="#main-content">Skip to menu</a>
    <header class="site-header">
      <a class="brand" href="#/" data-link aria-label="Hot n Spizee home">
        <img src="/assets/logo%20(2).jpeg" alt="">
        <span class="brand-copy"><strong>HOT <span>n</span> SPIZEE</strong><small>Fresh Food · Great Taste</small></span>

      <nav class="main-nav" aria-label="Main navigation">
