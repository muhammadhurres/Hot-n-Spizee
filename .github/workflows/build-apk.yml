name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Build and sync web assets
        run: npm run android:sync

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android

      - name: Copy APK with app name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/hotnspizee.apk

      - name: Publish latest Android APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: Hot n Spizee Latest Android APK
          files: android/app/build/outputs/apk/debug/hotnspizee.apk
          overwrite_files: true
